name: Release Packages

on:
  workflow_dispatch:
    inputs:
      pre:
        description: "Is this a NEW pre-release?"
        required: false
        default: false
        type: boolean
      level:
        description: "Release level"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - preup

jobs:
  release-packages:
    name: Release packages sequentially
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: jdx/mise-action@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: "node pnpm"
          cache: true

      - uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Release packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.pre }}" == "true" ]; then
            pnpm exec rlse --level ${{ github.event.inputs.level }} --pre
          else
            pnpm exec rlse --level ${{ github.event.inputs.level }}
          fi
