name: CI / Format

on:
  workflow_call:
    inputs:
      run:
        description: Run the format verification job
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    if: inputs.run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up workspace
        uses: ./.github/actions/setup-pnpm
        with:
          github-token: ${{ github.token }}

      - name: Run format checks
        run: pnpm fmt:check
